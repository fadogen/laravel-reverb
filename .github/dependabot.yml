version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    # A release is adopted only once it is a week old. Cooldown never delays
    # security updates.
    cooldown:
      default-days: 7
    # Major updates stay outside the groups and open individual pull requests.
    groups:
      laravel-runtime:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
